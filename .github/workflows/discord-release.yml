# Announces a published release in Discord, in the text the release's notes carry for it
# (.github/scripts/discord-release.mjs). It runs in the public repository, where the releases are;
# docs/README.dev.md says how to set it up and how to try it on a private channel.
name: Discord announcement

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release to announce, draft or not (v2.9.0)
        required: true
      channel:
        description: Where to post. "announcements" is public and only takes a published release.
        type: choice
        options: [test, announcements]
        default: test

permissions:
  # Only to read a draft's notes when trying it: GitHub has no narrower scope for that.
  contents: write

jobs:
  announce:
    # The private repository holds this file too, but neither its releases nor its secrets.
    if: github.repository == 'jesus-molano/OverLap' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      CHANNEL: ${{ github.event_name == 'release' && 'announcements' || inputs.channel }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Read now, not from the event: re-running after fixing the notes must see the fixed text.
      - name: Read the release's notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          unpublished=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')
          if [ "$CHANNEL" = announcements ] && [ "$unpublished" != false ]; then
            echo "::error::$TAG is a draft or a pre-release, so it cannot go to the public channel."
            exit 1
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md

      - name: Post
        env:
          ANNOUNCEMENTS: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          TEST: ${{ secrets.DISCORD_RELEASE_TEST_WEBHOOK }}
        run: |
          if [ "$CHANNEL" = announcements ]; then export DISCORD_WEBHOOK="$ANNOUNCEMENTS"; else export DISCORD_WEBHOOK="$TEST"; fi
          node .github/scripts/discord-release.mjs notes.md "$TAG" --post
