# The five checks of every change (CONTRIBUTING.md), on Windows like the app. No secrets.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request replaces its run; every push to main keeps its own.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # .gitattributes keeps the checkout LF on the Windows runner (Prettier and the LICENSE test).
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npx vitest run

      - name: Lint
        run: npx eslint . --max-warnings 0

      - name: Format
        run: npx prettier --check .

      - name: Build
        run: npx electron-vite build
